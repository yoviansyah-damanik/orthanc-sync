{% load static %}
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | {{ app_name }}</title>
    <link rel="icon" type="image/png" href="{% static 'img/logo-icon.png' %}">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; }</style>
</head>
<body class="min-h-screen flex items-center justify-center p-6 bg-slate-50">
    <div class="max-w-md w-full bg-white rounded-[3rem] card-shadow p-12">
        <div class="flex flex-col items-center mb-10">
            <img src="{% static 'img/logo-icon.png' %}" alt="Logo" class="w-24 h-24 object-contain shadow-2xl shadow-blue-500/20 rounded-[2rem] mb-6">
            <h1 class="text-3xl font-black text-gray-900 tracking-tight leading-none mb-2">{{ app_name }}</h1>
            <p class="text-gray-400 text-xs font-bold uppercase tracking-widest">{{ hospital_name }}</p>
        </div>

        {% if messages %}
        <div class="mb-6">
            {% for message in messages %}
            <div class="p-4 rounded-2xl bg-red-50 text-red-600 text-xs font-bold">
                {{ message }}
            </div>
            {% endfor %}
        </div>
        {% endif %}

        <form method="POST" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-[10px] font-black text-slate-400 uppercase tracking-[0.2em] mb-1.5 ml-1">Username</label>
                <input type="text" name="username" required class="w-full px-6 py-4 bg-slate-50 rounded-2xl focus:ring-4 focus:ring-blue-500/10 focus:bg-white transition-all outline-none text-sm font-bold shadow-sm">
            </div>
            <div>
                <label class="block text-[10px] font-black text-slate-400 uppercase tracking-[0.2em] mb-1.5 ml-1">Password</label>
                <input type="password" name="password" required class="w-full px-6 py-4 bg-slate-50 rounded-2xl focus:ring-4 focus:ring-blue-500/10 focus:bg-white transition-all outline-none text-sm font-bold shadow-sm">
            </div>
            <button type="submit" class="w-full py-4 bg-blue-600 text-white text-xs font-black uppercase tracking-widest rounded-2xl shadow-xl shadow-blue-500/30 hover:bg-blue-700 hover:-translate-y-1 transition-all active:translate-y-0">
                Masuk ke Sistem
            </button>
        </form>

        <div class="mt-10 text-center text-[10px] font-black text-slate-300 uppercase tracking-[0.3em]">
            &copy; {{ current_year }} {{ app_name }}
        </div>
    </div>
</body>
</html>
